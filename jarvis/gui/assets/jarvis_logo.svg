<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D7" />
      <stop offset="100%" stop-color="#00BFFF" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#00BFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00BFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#bg-gradient)" />
  
  <!-- Glow Effect -->
  <circle cx="50" cy="50" r="40" fill="url(#glow)" filter="url(#blur)" />
  
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7" />
  
  <!-- J.A.R.V.I.S. Text -->
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">J.A.R.V.I.S.</text>
  
  <!-- Minimalist Arc Reactor -->
  <circle cx="50" cy="60" r="12" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.9" />
  <circle cx="50" cy="60" r="7" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="50" cy="60" r="3" fill="#00BFFF" />
  
  <!-- Dynamic Elements -->
  <g opacity="0.7">
    <line x1="28" y1="60" x2="38" y2="60" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="62" y1="60" x2="72" y2="60" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="50" y1="38" x2="50" y2="48" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="50" y1="72" x2="50" y2="82" stroke="#FFFFFF" stroke-width="1.5" />
  </g>
  
  <!-- Pulsing Animation -->
  <circle cx="50" cy="60" r="20" fill="none" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.5">
    <animate attributeName="r" values="15;25;15" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
