<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00BFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#005C7A" stop-opacity="0.2" />
    </radialGradient>
    <radialGradient id="outer-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="rgba(0,191,255,0)" />
      <stop offset="80%" stop-color="rgba(0,191,255,0.3)" />
      <stop offset="100%" stop-color="rgba(0,191,255,0)" />
    </radialGradient>
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
  </defs>
  
  <!-- Outer Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#outer-glow)" filter="url(#blur-filter)" />
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#00BFFF" stroke-width="3" />
  
  <!-- Inner Segments -->
  <g id="segments">
    <path d="M100,40 L105,60 L95,60 Z" fill="#00BFFF" />
    <path d="M100,160 L105,140 L95,140 Z" fill="#00BFFF" />
    <path d="M40,100 L60,105 L60,95 Z" fill="#00BFFF" />
    <path d="M160,100 L140,105 L140,95 Z" fill="#00BFFF" />
    <path d="M58.6,58.6 L73.6,73.6 L66.5,80.7 Z" fill="#00BFFF" />
    <path d="M141.4,141.4 L126.4,126.4 L133.5,119.3 Z" fill="#00BFFF" />
    <path d="M58.6,141.4 L73.6,126.4 L80.7,133.5 Z" fill="#00BFFF" />
    <path d="M141.4,58.6 L126.4,73.6 L119.3,66.5 Z" fill="#00BFFF" />
  </g>
  
  <!-- Inner Circular Sections -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#00BFFF" stroke-width="2" stroke-dasharray="5,5" />
  <circle cx="100" cy="100" r="40" fill="url(#inner-glow)" />
  
  <!-- Central Core -->
  <circle cx="100" cy="100" r="15" fill="#FFFFFF" filter="url(#blur-filter)" />
  
  <!-- Pulsing Animation -->
  <animate xlink:href="#segments" attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
</svg>
